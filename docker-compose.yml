services:
  api:
    image: bonitashare-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    ports:
      - "3000-3001:3000"
    env_file:
      - apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared-types/node_modules

  worker:
    image: bonitashare-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: pnpm --filter api run worker
    healthcheck:
      disable: true
    env_file:
      - apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared-types/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - "4321:4321"
    environment:
      NODE_ENV: development
      API_INTERNAL_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules

  redis:
    image: redis:7-alpine
    container_name: bonitashare-cache
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - cache_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: pgsty/silo:latest
    container_name: bonitashare-storage
    restart: unless-stopped
    env_file:
      - .env.storage
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage_data:/data
    healthcheck:
      test: [ 'CMD', 'silo', 'healthcheck' ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: bonitashare-postgres
    restart: unless-stopped
    env_file:
      - .env.db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U pgdhruv -d bonitasharedb' ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  storage_data:
  cache_data:
