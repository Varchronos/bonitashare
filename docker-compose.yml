services:
  api:
    image: bonitashare-api
    # tini as PID 1 so SIGTERM reaches node; the grace period outlasts the app's 28s shutdown deadline.
    init: true
    stop_grace_period: 30s
    # Two by default so cross-replica paths (tus locks, metadata cache, resumes) get exercised locally.
    # Each takes a host port from the 3000-3001 range below; widen it before scaling further.
    deploy:
      replicas: 2
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    # tsx directly rather than through `pnpm run`: pnpm exits on SIGTERM without waiting for its
    # child, which takes the container down before the app's graceful shutdown can run.
    working_dir: /app/apps/api
    command: node_modules/.bin/tsx watch --conditions=development src/index.ts
    ports:
      - "3000-3001:3000"
    env_file:
      - apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared-types/node_modules
      - /app/packages/core/node_modules

  worker:
    image: bonitashare-worker
    # tini as PID 1 so SIGTERM reaches node; the grace period outlasts the app's 28s shutdown deadline.
    init: true
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev
    # Same as api: tsx directly so SIGTERM reaches the worker's shutdown handler.
    working_dir: /app/apps/worker
    command: node_modules/.bin/tsx watch --conditions=development src/index.ts
    env_file:
      - apps/worker/.env
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/worker/node_modules
      - /app/packages/core/node_modules

  video-worker:
    image: bonitashare-video-worker
    # tini as PID 1 so SIGTERM reaches node; the grace period outlasts the app's 28s shutdown deadline.
    init: true
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: apps/video-worker/Dockerfile
      target: dev
    # 4 CPUs is where the encode stops scaling (16 was only ~20% faster for twice the CPU time), so add
    # replicas for throughput rather than raising this. The worker reads this limit from cgroups and sizes
    # ffmpeg's threads to it. 2g covers the ~750MB encode at 4 threads plus 4K sources and node.
    cpus: 4
    mem_limit: 2g
    # Same as api: tsx directly so SIGTERM reaches the worker's shutdown handler.
    working_dir: /app/apps/video-worker
    command: node_modules/.bin/tsx watch --conditions=development src/index.ts
    env_file:
      - apps/video-worker/.env
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/video-worker/node_modules
      - /app/packages/core/node_modules

  web:
    # tini as PID 1 and astro run directly (not through `pnpm run`, which swallows SIGTERM), so
    # compose down stops web at once instead of waiting out the 10s grace period for a SIGKILL.
    # No drain yet: in-flight proxied uploads are dropped and resumed by the client.
    init: true
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    working_dir: /app/apps/web
    command: node_modules/.bin/astro dev --host --force
    ports:
      - "4321:4321"
    environment:
      NODE_ENV: development
      API_INTERNAL_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules

  redis:
    image: redis:7-alpine
    container_name: bonitashare-cache
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - cache_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: pgsty/silo:latest
    container_name: bonitashare-storage
    restart: unless-stopped
    env_file:
      - .env.storage
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage_data:/data
    healthcheck:
      test: [ 'CMD', 'silo', 'healthcheck' ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: bonitashare-postgres
    restart: unless-stopped
    env_file:
      - .env.db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U pgdhruv -d bonitasharedb' ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  storage_data:
  cache_data:
