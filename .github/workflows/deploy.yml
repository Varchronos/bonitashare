# Every push to main: typecheck, build the VPS images and push them to GHCR, then have the VPS pull and
# restart them (deploy/deploy.sh). Run it by hand from the Actions tab to redeploy, e.g. after a failure.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in push order. A newer push queues behind a running deploy rather than cutting
# it off mid-restart.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GHCR needs a lowercase owner.
  IMAGE_PREFIX: ghcr.io/varchronos/

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pnpm's version comes from packageManager in package.json.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: runtime
          push: true
          # The commit tag is what the VPS deploys; :main just marks the latest build.
          tags: |
            ${{ env.IMAGE_PREFIX }}bonitashare-${{ matrix.app }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}bonitashare-${{ matrix.app }}:main
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      # The key's authorized_keys entry on the VPS forces deploy/deploy.sh, so the only thing this
      # connection can do is deploy the commit it names.
      - name: Deploy to the VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$HOST" "$GITHUB_SHA"
