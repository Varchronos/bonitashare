services:
  api:
    image: bonitashare-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"

  worker:
    image: bonitashare-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command: node apps/api/dist/worker.js
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    ports:
      - "8080:4321"
    environment:
      API_INTERNAL_URL: http://api:3000
