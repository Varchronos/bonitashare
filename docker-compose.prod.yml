services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    ports:
      - "8080:80"
